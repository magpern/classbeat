# One grouped PR per ecosystem per week for minor/patch, and a separate one for majors, so a
# breaking major does not hold back the rest, to keep the number of CI runs down (issue #62).
# Runtime versions are fixed by ADR 0001: Python 3.12, Postgres 17, Node 24 LTS. Upgrading
# one of them is a deliberate change with its own issue, so Dependabot only offers patch
# updates for Python and minor/patch for Postgres and Node. @types/node follows the Node major.
version: 2
updates:
  - package-ecosystem: uv
    directory: /backend
    schedule:
      interval: weekly
    commit-message:
      prefix: build(deps)
      prefix-development: build(deps-dev)
    ignore:
      # anthropic 1.x and 2.x require httpx2, which the worker's egress allowlist and its guard
      # (classbeat.egress) are not built on: we stay on 0.125.0, the last 0.x (ADR 0006 section 2,
      # issue #120). Review by 2027-01-31, or earlier on a pip-audit advisory against 0.125.0.
      - dependency-name: anthropic
        update-types: ["version-update:semver-major"]
    groups:
      python:
        update-types: [minor, patch]
      python-major:
        update-types: [major]

  # One npm PR per week for both projects.
  - package-ecosystem: npm
    directories: [/frontend, /e2e]
    schedule:
      interval: weekly
    commit-message:
      prefix: build(deps)
      prefix-development: build(deps-dev)
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      npm:
        update-types: [minor, patch]
      npm-major:
        update-types: [major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci(deps)
    groups:
      actions:
        update-types: [minor, patch]
      actions-major:
        update-types: [major]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build(deps)
    ignore:
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: node
        update-types: ["version-update:semver-major"]
    groups:
      docker:
        update-types: [minor, patch]
      docker-major:
        update-types: [major]

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build(deps)
    ignore:
      - dependency-name: postgres
        update-types: ["version-update:semver-major"]
    groups:
      docker-compose:
        update-types: [minor, patch]
      docker-compose-major:
        update-types: [major]
