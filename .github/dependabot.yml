# Runtime versions are fixed by ADR 0001: Python 3.12, Postgres 17, Node 24 LTS. Upgrading
# one of them is a deliberate change with its own issue, so Dependabot only offers patch
# updates for Python and minor/patch for Postgres and Node. @types/node follows the Node major.
version: 2
updates:
  - package-ecosystem: uv
    directory: /backend
    schedule:
      interval: weekly
    commit-message:
      prefix: build(deps)
      prefix-development: build(deps-dev)
    groups:
      python-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    commit-message:
      prefix: build(deps)
      prefix-development: build(deps-dev)
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      npm-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /e2e
    schedule:
      interval: weekly
    commit-message:
      prefix: build(deps)
      prefix-development: build(deps-dev)
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      npm-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci(deps)
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build(deps)
    ignore:
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: node
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build(deps)
    ignore:
      - dependency-name: postgres
        update-types: ["version-update:semver-major"]
