name: CI

# Not on push to main: merges are squashes of an up-to-date, already-tested branch. The weekly
# run (and a manual one) runs everything, which also picks up new advisories.
on:
  pull_request:
  schedule:
    - cron: '0 4 * * 1' # Monday 04:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Which jobs does this change need? See scripts/ci-changes.sh (tested by scripts/test-ci-gate.sh).
  changes:
    name: Changes
    runs-on: ubuntu-24.04
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      stack: ${{ steps.filter.outputs.stack }}
      all: ${{ steps.filter.outputs.all }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: scripts/ci-changes.sh

  # Everything cheap that must run on every change, as steps of one runner (one billed
  # minute-rounding instead of seven). Trivy and gitleaks are checksum-verified release binaries.
  checks:
    name: Checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks
        env:
          VERSION: 8.30.1
          SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -fsSL -o gitleaks.tgz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
          echo "${SHA256}  gitleaks.tgz" | sha256sum --check
          tar -xzf gitleaks.tgz gitleaks

      # A pull request's own commits (#116 item 8; the checkout holds every branch); the weekly
      # and manual runs scan the whole history of every branch.
      - name: Secret scan
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = pull_request ]; then
            # A missing SHA or an empty range would make gitleaks report "no leaks" over 0
            # commits: fail instead. --diff-merges=first-parent makes `git log -p` show the diff
            # of a merge commit, so a secret added only in a hand-resolved merge is scanned.
            git cat-file -e "${BASE_SHA}^{commit}"
            git cat-file -e "${HEAD_SHA}^{commit}"
            count="$(git rev-list --count "${BASE_SHA}..${HEAD_SHA}")"
            [ "$count" -gt 0 ] || { echo "secret scan: no commits in ${BASE_SHA}..${HEAD_SHA}" >&2; exit 1; }
            "$RUNNER_TEMP/gitleaks" git --redact --verbose --exit-code 1               --log-opts="--diff-merges=first-parent ${BASE_SHA}..${HEAD_SHA}" .
          else
            "$RUNNER_TEMP/gitleaks" git --redact --verbose --exit-code 1 .
          fi

      - name: bash -n
        run: for f in scripts/*.sh; do bash -n "$f"; done

      # koalaman/shellcheck v0.11.0, pinned by its index digest. Dependabot does not track an
      # image used in a `run:` step: bump the tag and digest here by hand.
      - name: shellcheck
        run: |
          docker run --rm -v "$PWD:/mnt:ro" -w /mnt \
            koalaman/shellcheck@sha256:61862eba1fcf09a484ebcc6feea46f1782532571a34ed51fedf90dd25f925a8d \
            scripts/*.sh

      - name: CI gate and change-filter tests
        run: scripts/test-ci-gate.sh

      # The queue functions' expected md5 (backend/src/classbeat/db/queue_digests.py) is computed
      # on one Postgres image: compose's db and db-functions and the backend job's service must
      # all run that same exact tag.
      - name: Postgres image pinned alike
        run: |
          set -euo pipefail
          db="$(yq -r '.services.db.image' compose.yaml)"
          fn="$(yq -r '.services["db-functions"].image' compose.yaml)"
          ci="$(yq -r '.jobs.backend.services.postgres.image' .github/workflows/ci.yml)"
          echo "db=$db db-functions=$fn backend=$ci"
          [[ "$db" =~ ^postgres:[0-9]+\.[0-9]+$ ]] || { echo "::error::compose db image must be an exact postgres tag"; exit 1; }
          [ "$fn" = "$db" ] && [ "$ci" = "$db" ] || { echo "::error::db, db-functions and the backend job must use the same postgres image"; exit 1; }

      # Every setup-uv step's version equals the Dockerfile's uv tag (scripts/ci-uv-version.sh).
      - name: uv version matches the Dockerfile
        run: scripts/ci-uv-version.sh

      # rhysd/actionlint v1.7.12 (includes shellcheck), pinned by its index digest. Dependabot
      # does not track an image used in a `run:` step: bump the tag and digest here by hand.
      - name: actionlint
        run: |
          docker run --rm -v "$PWD:/repo:ro" -w /repo \
            rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 \
            -color

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          # Must equal the ghcr.io/astral-sh/uv tag in the Dockerfile (checked above).
          version: 0.13.6

      # pip-audit itself comes from the hash-locked `audit` group of backend/uv.lock.
      # It audits exactly what uv.lock pins: production dependencies, then every group
      # (dev and audit) too. mowl-workouts is our own library, vendored as a wheel built from its
      # tag (scripts/build-mowl-wheel.sh) and not on PyPI, so pip-audit can't look it up; it is
      # left out of the export, and its dependencies are still audited.
      - name: pip-audit
        working-directory: backend
        run: |
          set -euo pipefail
          uv sync --frozen --only-group audit
          uv export -q --frozen --no-dev --no-emit-project --no-emit-package mowl-workouts \
            -o "$RUNNER_TEMP/requirements-prod.txt"
          uv export -q --frozen --no-emit-project --no-emit-package mowl-workouts --all-groups \
            -o "$RUNNER_TEMP/requirements-all.txt"
          for f in requirements-prod requirements-all; do
            uv run --frozen --only-group audit pip-audit \
              --require-hashes --disable-pip --strict \
              -r "$RUNNER_TEMP/$f.txt"
          done

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: npm audit
        run: |
          set -euo pipefail
          for dir in frontend e2e; do
            (cd "$dir" && npm audit --audit-level=high)
          done

      # Trivy fails on HIGH and CRITICAL findings that have a fix available (--ignore-unfixed):
      # an accepted risk, see AGENTS.md. Exceptions go in .trivyignore with a reason and an
      # exp:YYYY-MM-DD expiry. The image scan lives in the `e2e` job.
      - name: Install Trivy
        env:
          VERSION: 0.76.1
          SHA256: c7cbe3137fb8a48a17574bede3dd6beb16742d1e9772929940fc90082c39d9c0
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -fsSL -o trivy.tgz \
            "https://github.com/aquasecurity/trivy/releases/download/v${VERSION}/trivy_${VERSION}_Linux-64bit.tar.gz"
          echo "${SHA256}  trivy.tgz" | sha256sum --check
          tar -xzf trivy.tgz trivy

      - name: Trivy repository scan
        run: |
          "$RUNNER_TEMP/trivy" fs \
            --scanners vuln,misconfig \
            --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 \
            --skip-dirs node_modules --skip-dirs .venv \
            .

  frontend:
    name: Frontend
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  backend:
    name: Backend
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        # The same exact tag as compose's db (checked in `checks`): the queue md5 depends on it.
        image: postgres:17.11
        env:
          # Throwaway database of this job only; not a secret.
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CLASSBEAT_TEST_DATABASE_URL: postgresql+psycopg://postgres:test@127.0.0.1:5432/classbeat
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Create the application database and its roles
        # The script the compose db container runs (docker/postgres/init), against the service
        # container. The test fixtures replace the role passwords with random ones.
        working-directory: .
        env:
          PGHOST: 127.0.0.1
          PGUSER: postgres
          PGPASSWORD: test
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -d postgres -c 'CREATE DATABASE classbeat'
          secrets="$RUNNER_TEMP/secrets"
          mkdir -p "$secrets"
          openssl rand -hex 16 > "$secrets/database_owner_password"
          openssl rand -hex 16 > "$secrets/database_password"
          export DATABASE_OWNER_PASSWORD_FILE="$secrets/database_owner_password"
          export DATABASE_PASSWORD_FILE="$secrets/database_password"
          psql -v ON_ERROR_STOP=1 -d classbeat -f docker/postgres/init/10-roles.sql
          # Idempotent: a second run must succeed too.
          psql -v ON_ERROR_STOP=1 -d classbeat -f docker/postgres/init/10-roles.sql

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          # Must equal the ghcr.io/astral-sh/uv tag in the Dockerfile (checked by the `checks` job).
          version: 0.13.6

      - name: Install dependencies
        run: uv sync --locked

      # Regenerates the expected md5 of the queue functions (ADR 0005 section 3) on the pinned
      # image and fails when the committed queue_digests.py is stale (README: how to refresh it).
      # The database goes back to base afterwards; the tests migrate it themselves.
      - name: Queue functions match their shipped md5
        env:
          PGHOST: 127.0.0.1
          PGUSER: postgres
          PGPASSWORD: test
          CLASSBEAT_MIGRATIONS_DATABASE_URL: postgresql+psycopg://classbeat_owner@127.0.0.1:5432/classbeat
        run: |
          set -euo pipefail
          export CLASSBEAT_SECRETS_DIR="$RUNNER_TEMP/secrets"
          uv run alembic upgrade head
          psql --single-transaction -v ON_ERROR_STOP=1 -q -d classbeat -f ../docker/postgres/queue/20-queue.sql
          # Idempotent: a second run must succeed too.
          psql --single-transaction -v ON_ERROR_STOP=1 -q -d classbeat -f ../docker/postgres/queue/20-queue.sql
          uv run python tests/queue_digests.py --check
          uv run alembic downgrade base

      - name: Lint
        run: uv run ruff check

      - name: Format check
        run: uv run ruff format --check

      - name: Type check
        run: uv run pyright

      - name: Tests
        run: uv run pytest

  e2e:
    name: Stack, image scan and E2E (Playwright)
    needs: changes
    if: needs.changes.outputs.stack == 'true'
    runs-on: ubuntu-24.04
    env:
      # The test-only fake OpenID provider (compose.e2e.yaml); never part of the default stack.
      COMPOSE_FILE: compose.yaml:compose.e2e.yaml
      COMPOSE_PROFILES: e2e
    defaults:
      run:
        working-directory: e2e
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install Trivy
        env:
          VERSION: 0.76.1
          SHA256: c7cbe3137fb8a48a17574bede3dd6beb16742d1e9772929940fc90082c39d9c0
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -fsSL -o trivy.tgz \
            "https://github.com/aquasecurity/trivy/releases/download/v${VERSION}/trivy_${VERSION}_Linux-64bit.tar.gz"
          echo "${SHA256}  trivy.tgz" | sha256sum --check
          tar -xzf trivy.tgz trivy

      - name: Create .env and secrets
        working-directory: .
        run: |
          set -euo pipefail
          scripts/worktree.sh init
          # init leaves the model key empty (ADR 0006 section 9). A random canary, never a real
          # key, lets the checks below prove where the value goes. The worker stays on `fake`.
          if [ ! -f secrets/anthropic_api_key ] || [ -s secrets/anthropic_api_key ]; then
            echo "::error::init must create an empty secrets/anthropic_api_key"
            exit 1
          fi
          printf 'ci-canary-not-a-key-%s' "$(openssl rand -hex 16)" > secrets/anthropic_api_key

      - name: Start the stack
        working-directory: .
        run: docker compose up -d --build --wait

      - name: Check /api/ready and /
        working-directory: .
        run: |
          set -euo pipefail
          port="$(sed -n 's/^WEB_PORT=//p' .env)"
          curl -fsS --retry 5 --retry-delay 2 "http://127.0.0.1:${port}/api/ready"
          curl -fsS "http://127.0.0.1:${port}/" | grep -qi '<!doctype html>'

      - name: Check the containers run as non-root
        working-directory: .
        run: |
          set -euo pipefail
          for svc in web worker; do
            uid="$(docker compose exec -T "$svc" id -u)"
            echo "$svc runs as uid $uid"
            [ "$uid" != "0" ] || { echo "::error::$svc runs as root"; exit 1; }
          done

      # Secret values only come from files under secrets/ (Docker secrets); none may appear
      # in the container configuration. Values are never printed.
      - name: Check no secret value is in docker inspect
        working-directory: .
        run: |
          set -euo pipefail
          mapfile -t containers < <(docker compose ps -aq)
          [ "${#containers[@]}" -gt 0 ] || { echo "::error::no containers found"; exit 1; }
          docker inspect "${containers[@]}" > "$RUNNER_TEMP/inspect.json"
          checked=0
          for f in secrets/*; do
            [ -s "$f" ] || continue
            checked=$((checked + 1))
            if grep -qF -- "$(cat "$f")" "$RUNNER_TEMP/inspect.json"; then
              echo "::error::a value from $f appears in docker inspect"
              exit 1
            fi
          done
          [ "$checked" -gt 0 ] || { echo "::error::no secret files were checked"; exit 1; }
          # The connection KEK (ADR 0004 section 7) and the model key canary (ADR 0006 section 9)
          # must exist and so were among them.
          [ -s secrets/connection_kek ] || { echo "::error::secrets/connection_kek is missing"; exit 1; }
          [ -s secrets/anthropic_api_key ] || { echo "::error::secrets/anthropic_api_key is empty"; exit 1; }
          rm -f "$RUNNER_TEMP/inspect.json"

      # The superuser password (ADR 0005 section 3, amending ADR 0002 section 4) is mounted on db
      # and db-functions only: never on web, worker, migrate or maint (all profiles enabled).
      - name: Check postgres_password is mounted on db and db-functions only
        working-directory: .
        run: |
          set -euo pipefail
          config="$(docker compose --profile '*' config --format json)"
          holders="$(jq -r '[.services | to_entries[]
            | select((.value.secrets // []) | map(.source) | index("postgres_password")) | .key]
            | sort | join(" ")' <<< "$config")"
          echo "postgres_password is mounted on: $holders"
          [ "$holders" = "db db-functions" ] \
            || { echo "::error::postgres_password must be mounted on db and db-functions only"; exit 1; }
          for svc in web worker migrate maint; do
            jq -e --arg s "$svc" '.services | has($s)' <<< "$config" > /dev/null \
            || { echo "::error::service $svc not found in the compose config"; exit 1; }
          done
          for svc in web worker; do
            docker compose exec -T "$svc" sh -c '! test -e /run/secrets/postgres_password' \
            || { echo "::error::$svc can read postgres_password"; exit 1; }
          done
          [ "$(docker inspect --format '{{.State.ExitCode}}' "$(docker compose ps -aq db-functions)")" = 0 ] \
            || { echo "::error::db-functions did not succeed"; exit 1; }

      # ADR 0011 section 5: the admin role's password is mounted on db-functions (which sets it)
      # and web (the admin area) only: never on the worker, migrate or maint.
      - name: Check database_maint_password is mounted on db-functions and web only
        working-directory: .
        run: |
          set -euo pipefail
          config="$(docker compose --profile '*' config --format json)"
          holders="$(jq -r '[.services | to_entries[]
            | select((.value.secrets // []) | map(.source) | index("database_maint_password"))
            | .key] | sort | join(" ")' <<< "$config")"
          echo "database_maint_password is mounted on: $holders"
          [ "$holders" = "db-functions web" ] \
            || { echo "::error::database_maint_password must be mounted on db-functions and web only"; exit 1; }
          docker compose exec -T web test -s /run/secrets/database_maint_password \
            || { echo "::error::web does not have the database_maint_password secret"; exit 1; }
          docker compose exec -T worker sh -c '! test -e /run/secrets/database_maint_password' \
            || { echo "::error::the worker can read database_maint_password"; exit 1; }

      # ADR 0006 section 9: the model key is a file on the worker only, never an env variable.
      - name: Check the model key is mounted on the worker only
        working-directory: .
        run: |
          set -euo pipefail
          worker="$(docker compose ps -q worker)"
          [ -n "$worker" ] || { echo "::error::no worker container"; exit 1; }
          if ! docker compose exec -T worker test -s /run/secrets/anthropic_api_key; then
            echo "::error::the worker does not have the anthropic_api_key secret"
            exit 1
          fi
          provider="$(docker compose exec -T worker printenv CLASSBEAT_MODEL_PROVIDER)"
          if [ "$provider" != "fake" ]; then
            echo "::error::the stack's worker must run the fake model provider"
            exit 1
          fi
          mapfile -t containers < <(docker compose ps -aq)
          [ "${#containers[@]}" -gt 1 ] || { echo "::error::too few containers"; exit 1; }
          for c in "${containers[@]}"; do
            name="$(docker inspect --format '{{.Name}}' "$c")"
            if [ "$c" != "$worker" ] && docker inspect \
              --format '{{range .Mounts}}{{println .Source .Destination}}{{end}}' "$c" \
              | grep -q anthropic_api_key; then
              echo "::error::$name mounts anthropic_api_key; only the worker may"
              exit 1
            fi
            if docker inspect --format '{{range .Config.Env}}{{println .}}{{end}}' "$c" \
              | grep -qiE '^[a-z_]*(anthropic|api_key)[a-z_]*='; then
              echo "::error::$name has a model key variable in its environment"
              exit 1
            fi
          done

      # The image the running stack was built from (never pushed). Fails on HIGH and CRITICAL
      # findings that have a fix available (--ignore-unfixed): an accepted risk, see AGENTS.md.
      - name: Scan the image the stack runs
        working-directory: .
        run: |
          set -euo pipefail
          image="$(docker inspect --format '{{.Image}}' "$(docker compose ps -q web)")"
          "$RUNNER_TEMP/trivy" image \
            --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 \
            "$image"

      - run: npm ci
      - run: npm run typecheck
      - run: npx playwright install --with-deps chromium

      - name: Run the tests
        run: npx playwright test

      - name: Upload the report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7

      - name: Logs on failure
        if: failure()
        working-directory: .
        run: docker compose ps -a && docker compose logs --no-color --tail 100

      - name: Stop the stack
        if: always()
        working-directory: .
        run: docker compose down -v

  # The one required check. `changes` and `checks` must succeed. Every other job must succeed, or be
  # skipped while its filter output is false (scripts/ci-gate.sh, tested in `checks`). A job that is
  # needed but skipped, cancelled or failed fails the gate, so nothing is bypassed silently.
  ci:
    name: ci
    if: always()
    needs: [changes, checks, backend, frontend, e2e]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: All needed jobs passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
          NEEDS: ${{ toJSON(needs) }}
        run: scripts/ci-gate.sh
