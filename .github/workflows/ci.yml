name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks
        env:
          VERSION: 8.30.1
          SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -fsSL -o gitleaks.tgz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
          echo "${SHA256}  gitleaks.tgz" | sha256sum --check
          tar -xzf gitleaks.tgz gitleaks

      - name: Scan the whole history
        run: '"$RUNNER_TEMP/gitleaks" git --redact --verbose --exit-code 1 .'

  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  backend:
    name: Backend
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17
        env:
          # Throwaway database of this job only; not a secret.
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CLASSBEAT_TEST_DATABASE_URL: postgresql+psycopg://postgres:test@127.0.0.1:5432/classbeat
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Create the application database and its roles
        # The script the compose db container runs (docker/postgres/init), against the service
        # container. The test fixtures replace the role passwords with random ones.
        working-directory: .
        env:
          PGHOST: 127.0.0.1
          PGUSER: postgres
          PGPASSWORD: test
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -d postgres -c 'CREATE DATABASE classbeat'
          secrets="$RUNNER_TEMP/secrets"
          mkdir -p "$secrets"
          openssl rand -hex 16 > "$secrets/database_owner_password"
          openssl rand -hex 16 > "$secrets/database_password"
          export DATABASE_OWNER_PASSWORD_FILE="$secrets/database_owner_password"
          export DATABASE_PASSWORD_FILE="$secrets/database_password"
          psql -v ON_ERROR_STOP=1 -d classbeat -f docker/postgres/init/10-roles.sql
          # Idempotent: a second run must succeed too.
          psql -v ON_ERROR_STOP=1 -d classbeat -f docker/postgres/init/10-roles.sql

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          # Must equal the ghcr.io/astral-sh/uv tag in the Dockerfile (checked by `workflows`).
          version: 0.13.6

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check

      - name: Format check
        run: uv run ruff format --check

      - name: Type check
        run: uv run pyright

      - name: Tests
        run: uv run pytest

  e2e:
    name: Stack and E2E (Playwright)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: e2e
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Create .env and secrets
        working-directory: .
        run: scripts/worktree.sh init

      - name: Start the stack
        working-directory: .
        run: docker compose up -d --build --wait

      - name: Check /api/ready and /
        working-directory: .
        run: |
          set -euo pipefail
          port="$(sed -n 's/^WEB_PORT=//p' .env)"
          curl -fsS --retry 5 --retry-delay 2 "http://127.0.0.1:${port}/api/ready"
          curl -fsS "http://127.0.0.1:${port}/" | grep -qi '<!doctype html>'

      - name: Check the containers run as non-root
        working-directory: .
        run: |
          set -euo pipefail
          for svc in web worker; do
            uid="$(docker compose exec -T "$svc" id -u)"
            echo "$svc runs as uid $uid"
            [ "$uid" != "0" ] || { echo "::error::$svc runs as root"; exit 1; }
          done

      # Secret values only come from files under secrets/ (Docker secrets); none may appear
      # in the container configuration. Values are never printed.
      - name: Check no secret value is in docker inspect
        working-directory: .
        run: |
          set -euo pipefail
          mapfile -t containers < <(docker compose ps -aq)
          [ "${#containers[@]}" -gt 0 ] || { echo "::error::no containers found"; exit 1; }
          docker inspect "${containers[@]}" > "$RUNNER_TEMP/inspect.json"
          checked=0
          for f in secrets/*; do
            [ -s "$f" ] || continue
            checked=$((checked + 1))
            if grep -qF -- "$(cat "$f")" "$RUNNER_TEMP/inspect.json"; then
              echo "::error::a value from $f appears in docker inspect"
              exit 1
            fi
          done
          [ "$checked" -gt 0 ] || { echo "::error::no secret files were checked"; exit 1; }
          rm -f "$RUNNER_TEMP/inspect.json"

      - run: npm ci
      - run: npm run typecheck
      - run: npx playwright install --with-deps chromium

      - name: Run the tests
        run: npx playwright test

      - name: Upload the report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7

      - name: Logs on failure
        if: failure()
        working-directory: .
        run: docker compose ps -a && docker compose logs --no-color --tail 100

      - name: Stop the stack
        if: always()
        working-directory: .
        run: docker compose down -v

  pip-audit:
    name: Python dependency audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          # Must equal the ghcr.io/astral-sh/uv tag in the Dockerfile (checked by `workflows`).
          version: 0.13.6

      # pip-audit itself comes from the hash-locked `audit` group of backend/uv.lock.
      # It audits exactly what uv.lock pins: production dependencies, then every group
      # (dev and audit) too.
      - name: Audit locked dependencies
        working-directory: backend
        run: |
          set -euo pipefail
          uv sync --frozen --only-group audit
          uv export -q --frozen --no-dev --no-emit-project -o "$RUNNER_TEMP/requirements-prod.txt"
          uv export -q --frozen --no-emit-project --all-groups -o "$RUNNER_TEMP/requirements-all.txt"
          for f in requirements-prod requirements-all; do
            uv run --frozen --only-group audit pip-audit \
              --require-hashes --disable-pip --strict \
              -r "$RUNNER_TEMP/$f.txt"
          done

  npm-audit:
    name: npm dependency audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Audit locked dependencies
        run: |
          set -euo pipefail
          for dir in frontend e2e; do
            (cd "$dir" && npm audit --audit-level=high)
          done

  # Trivy runs from a checksum-verified release binary. Scans fail on HIGH and CRITICAL
  # findings that have a fix available (--ignore-unfixed): an accepted risk, see AGENTS.md.
  # Exceptions go in .trivyignore with a reason and an exp:YYYY-MM-DD expiry.
  trivy-fs:
    name: Trivy repository scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Trivy
        env:
          VERSION: 0.76.1
          SHA256: c7cbe3137fb8a48a17574bede3dd6beb16742d1e9772929940fc90082c39d9c0
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -fsSL -o trivy.tgz \
            "https://github.com/aquasecurity/trivy/releases/download/v${VERSION}/trivy_${VERSION}_Linux-64bit.tar.gz"
          echo "${SHA256}  trivy.tgz" | sha256sum --check
          tar -xzf trivy.tgz trivy

      - name: Scan the repository
        run: |
          "$RUNNER_TEMP/trivy" fs \
            --scanners vuln,misconfig \
            --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 \
            --skip-dirs node_modules --skip-dirs .venv \
            .

  trivy-image:
    name: Trivy image scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Trivy
        env:
          VERSION: 0.76.1
          SHA256: c7cbe3137fb8a48a17574bede3dd6beb16742d1e9772929940fc90082c39d9c0
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -fsSL -o trivy.tgz \
            "https://github.com/aquasecurity/trivy/releases/download/v${VERSION}/trivy_${VERSION}_Linux-64bit.tar.gz"
          echo "${SHA256}  trivy.tgz" | sha256sum --check
          tar -xzf trivy.tgz trivy

      # Built here, never pushed.
      - name: Build the image
        run: docker build -t classbeat:ci .

      - name: Scan the image
        run: |
          "$RUNNER_TEMP/trivy" image \
            --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 \
            classbeat:ci

  shellcheck:
    name: Shell scripts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: bash -n
        run: for f in scripts/*.sh; do bash -n "$f"; done

      # koalaman/shellcheck v0.11.0, pinned by its index digest. Dependabot does not track an
      # image used in a `run:` step: bump the tag and digest here by hand.
      - name: shellcheck
        run: |
          docker run --rm -v "$PWD:/mnt:ro" -w /mnt \
            koalaman/shellcheck@sha256:61862eba1fcf09a484ebcc6feea46f1782532571a34ed51fedf90dd25f925a8d \
            scripts/*.sh

  workflows:
    name: Workflows
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # setup-uv's `version:` (ci.yml) and the Dockerfile's uv tag must not drift: Dependabot
      # only bumps the Dockerfile.
      - name: uv version matches the Dockerfile
        run: |
          set -euo pipefail
          want="$(sed -n 's|^FROM ghcr.io/astral-sh/uv:\([0-9][0-9.]*\) .*|\1|p' Dockerfile)"
          [ -n "$want" ] || { echo "::error::no uv tag found in the Dockerfile"; exit 1; }
          bad=0
          while read -r v; do
            [ "$v" = "$want" ] || { echo "::error::setup-uv version $v differs from Dockerfile uv $want"; bad=1; }
          done < <(sed -n 's/^ *version: *\([0-9][0-9.]*\) *$/\1/p' .github/workflows/ci.yml)
          exit "$bad"

      # rhysd/actionlint v1.7.12 (includes shellcheck), pinned by its index digest. Dependabot
      # does not track an image used in a `run:` step: bump the tag and digest here by hand.
      - name: actionlint
        run: |
          docker run --rm -v "$PWD:/repo:ro" -w /repo             rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667             -color

  # The one required check. Every job above is listed in `needs`; a skipped job passes,
  # anything else fails the gate.
  ci:
    name: ci
    if: always()
    needs: [secrets, frontend, backend, e2e, shellcheck, workflows, pip-audit, npm-audit, trivy-fs, trivy-image]
    runs-on: ubuntu-24.04
    steps:
      - name: All jobs passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for r in $RESULTS; do
            case "$r" in success|skipped) ;; *) exit 1 ;; esac
          done
