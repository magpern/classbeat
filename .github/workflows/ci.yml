name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks
        env:
          VERSION: 8.30.1
          SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -fsSL -o gitleaks.tgz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
          echo "${SHA256}  gitleaks.tgz" | sha256sum --check
          tar -xzf gitleaks.tgz gitleaks

      - name: Scan the whole history
        run: '"$RUNNER_TEMP/gitleaks" git --redact --verbose --exit-code 1 .'

  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  backend:
    name: Backend
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17
        env:
          # Throwaway database of this job only; not a secret.
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CLASSBEAT_TEST_DATABASE_URL: postgresql+psycopg://postgres:test@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check

      - name: Format check
        run: uv run ruff format --check

      - name: Type check
        run: uv run pyright

      - name: Tests
        run: uv run pytest

  compose:
    name: Compose stack
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Create .env and secrets
        run: scripts/worktree.sh init

      - name: Start the stack
        run: docker compose up -d --build --wait

      - name: Check /api/ready and /
        run: |
          set -euo pipefail
          curl -fsS --retry 5 --retry-delay 2 http://127.0.0.1:8000/api/ready
          curl -fsS http://127.0.0.1:8000/ | grep -qi '<!doctype html>'

      - name: Logs on failure
        if: failure()
        run: docker compose ps -a && docker compose logs --no-color --tail 100

      - name: Stop the stack
        if: always()
        run: docker compose down -v

  # The one required check. Every job above is listed in `needs`; a skipped job passes,
  # anything else fails the gate.
  ci:
    name: ci
    if: always()
    needs: [secrets, frontend, backend, compose]
    runs-on: ubuntu-24.04
    steps:
      - name: All jobs passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for r in $RESULTS; do
            case "$r" in success|skipped) ;; *) exit 1 ;; esac
          done
