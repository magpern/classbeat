name: CI

# Not on push to main: main only receives squashes the merge queue has tested. A pull request and
# a merge group (the queue's merged result, `merge_group`) run what their diff needs; the weekly run
# (and a manual one) runs everything, which also picks up new advisories.
on:
  pull_request:
  merge_group:
  schedule:
    - cron: '0 4 * * 1' # Monday 04:00 UTC
  workflow_dispatch:

permissions:
  contents: read

# Only a pull request's older run is cancelled. A merge group never is (its ref is unique per
# group, and the queue itself drops a group it no longer needs).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Which jobs does this change need? See scripts/ci-changes.sh (tested by scripts/test-ci-gate.sh).
  changes:
    name: Changes
    runs-on: ubuntu-24.04
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      stack: ${{ steps.filter.outputs.stack }}
      all: ${{ steps.filter.outputs.all }}
      # The backend test shard count, from the backend-tests matrix's shard list (the one source).
      shards: ${{ steps.shards.outputs.total }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          # A merge group's base is the target branch tip, its head the queue's merged commit.
          BASE_SHA: ${{ github.event_name == 'merge_group' && github.event.merge_group.base_sha || github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event_name == 'merge_group' && github.event.merge_group.head_sha || github.event.pull_request.head.sha }}
        run: scripts/ci-changes.sh

      # Fails the run when the matrix is not exactly `shard: [1..N]` (scripts/ci-shards.sh).
      - id: shards
        run: |
          set -euo pipefail
          total="$(scripts/ci-shards.sh)"
          echo "total=$total" >> "$GITHUB_OUTPUT"

  # Everything cheap that must run on every change, as steps of one runner (one billed
  # minute-rounding instead of seven). Trivy and gitleaks are checksum-verified release binaries.
  checks:
    name: Checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks
        env:
          VERSION: 8.30.1
          SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -fsSL -o gitleaks.tgz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
          echo "${SHA256}  gitleaks.tgz" | sha256sum --check
          tar -xzf gitleaks.tgz gitleaks

      # A pull request's own commits (#116 item 8; the checkout holds every branch), or a merge
      # group's commits on top of its base; the weekly and manual runs scan the whole history of
      # every branch.
      - name: Secret scan
        env:
          EVENT_NAME: ${{ github.event_name }}
          # A merge group's base is the target branch tip, its head the queue's merged commit.
          BASE_SHA: ${{ github.event_name == 'merge_group' && github.event.merge_group.base_sha || github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event_name == 'merge_group' && github.event.merge_group.head_sha || github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = pull_request ] || [ "$EVENT_NAME" = merge_group ]; then
            # A missing SHA or an empty range would make gitleaks report "no leaks" over 0
            # commits: fail instead. --diff-merges=first-parent makes `git log -p` show the diff
            # of a merge commit, so a secret added only in a hand-resolved merge is scanned.
            git cat-file -e "${BASE_SHA}^{commit}"
            git cat-file -e "${HEAD_SHA}^{commit}"
            count="$(git rev-list --count "${BASE_SHA}..${HEAD_SHA}")"
            [ "$count" -gt 0 ] || { echo "secret scan: no commits in ${BASE_SHA}..${HEAD_SHA}" >&2; exit 1; }
            "$RUNNER_TEMP/gitleaks" git --redact --verbose --exit-code 1 \
              --log-opts="--diff-merges=first-parent ${BASE_SHA}..${HEAD_SHA}" .
          else
            "$RUNNER_TEMP/gitleaks" git --redact --verbose --exit-code 1 .
          fi

      - name: bash -n
        run: for f in scripts/*.sh; do bash -n "$f"; done

      # koalaman/shellcheck v0.11.0, pinned by its index digest. Dependabot does not track an
      # image used in a `run:` step: bump the tag and digest here by hand.
      - name: shellcheck
        run: |
          docker run --rm -v "$PWD:/mnt:ro" -w /mnt \
            koalaman/shellcheck@sha256:61862eba1fcf09a484ebcc6feea46f1782532571a34ed51fedf90dd25f925a8d \
            scripts/*.sh

      - name: CI gate and change-filter tests
        run: scripts/test-ci-gate.sh

      # The queue functions' expected md5 (backend/src/classbeat/db/queue_digests.py) is computed
      # on one Postgres image: compose's db and db-functions and the backend job's service must
      # all run that same exact tag.
      - name: Postgres image pinned alike
        run: |
          set -euo pipefail
          db="$(yq -r '.services.db.image' compose.yaml)"
          fn="$(yq -r '.services["db-functions"].image' compose.yaml)"
          ci="$(yq -r '.jobs.backend.services.postgres.image' .github/workflows/ci.yml)"
          shards="$(yq -r '.jobs["backend-tests"].services.postgres.image' .github/workflows/ci.yml)"
          echo "db=$db db-functions=$fn backend=$ci backend-tests=$shards"
          [[ "$db" =~ ^postgres:[0-9]+\.[0-9]+$ ]] || { echo "::error::compose db image must be an exact postgres tag"; exit 1; }
          [ "$fn" = "$db" ] && [ "$ci" = "$db" ] && [ "$shards" = "$db" ] \
            || { echo "::error::db, db-functions and the backend jobs must use the same postgres image"; exit 1; }

      # compose.prod.yaml and the Caddyfile (issue #341): config parses with dummy values, the
      # production invariants hold (only caddy publishes ports, no mailpit, internal backend
      # network, no model key on web ...) and `caddy validate` accepts the Caddyfile.
      - name: Production compose and Caddyfile
        run: scripts/check-prod-compose.sh

      # Every setup-uv step's version equals the Dockerfile's uv tag (scripts/ci-uv-version.sh).
      - name: uv version matches the Dockerfile
        run: scripts/ci-uv-version.sh

      # rhysd/actionlint v1.7.12 (includes shellcheck), pinned by its index digest. Dependabot
      # does not track an image used in a `run:` step: bump the tag and digest here by hand.
      - name: actionlint
        run: |
          docker run --rm -v "$PWD:/repo:ro" -w /repo \
            rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 \
            -color

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          # Must equal the ghcr.io/astral-sh/uv tag in the Dockerfile (checked above).
          version: 0.13.6

      # pip-audit itself comes from the hash-locked `audit` group of backend/uv.lock.
      # It audits exactly what uv.lock pins: production dependencies, then every group
      # (dev and audit) too. mowl-workouts is our own library, vendored as a wheel built from its
      # tag (scripts/build-mowl-wheel.sh) and not on PyPI, so pip-audit can't look it up; it is
      # left out of the export, and its dependencies are still audited.
      - name: pip-audit
        working-directory: backend
        run: |
          set -euo pipefail
          uv sync --frozen --only-group audit
          uv export -q --frozen --no-dev --no-emit-project --no-emit-package mowl-workouts \
            -o "$RUNNER_TEMP/requirements-prod.txt"
          uv export -q --frozen --no-emit-project --no-emit-package mowl-workouts --all-groups \
            -o "$RUNNER_TEMP/requirements-all.txt"
          for f in requirements-prod requirements-all; do
            uv run --frozen --only-group audit pip-audit \
              --require-hashes --disable-pip --strict \
              -r "$RUNNER_TEMP/$f.txt"
          done

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: npm audit
        run: |
          set -euo pipefail
          for dir in frontend e2e; do
            (cd "$dir" && npm audit --audit-level=high)
          done

      # Trivy fails on HIGH and CRITICAL findings that have a fix available (--ignore-unfixed):
      # an accepted risk, see AGENTS.md. Exceptions go in .trivyignore with a reason and an
      # exp:YYYY-MM-DD expiry. The image scan lives in the `e2e` job.
      - name: Install Trivy
        env:
          VERSION: 0.76.1
          SHA256: c7cbe3137fb8a48a17574bede3dd6beb16742d1e9772929940fc90082c39d9c0
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -fsSL -o trivy.tgz \
            "https://github.com/aquasecurity/trivy/releases/download/v${VERSION}/trivy_${VERSION}_Linux-64bit.tar.gz"
          echo "${SHA256}  trivy.tgz" | sha256sum --check
          tar -xzf trivy.tgz trivy

      - name: Trivy repository scan
        run: |
          "$RUNNER_TEMP/trivy" fs \
            --scanners vuln,misconfig \
            --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 \
            --skip-dirs node_modules --skip-dirs .venv \
            .

  frontend:
    name: Frontend
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # First-load JavaScript from the build's own output, at most 250 kB gzip (ADR 0013 section 11).
      - run: npm run check:bundle

  backend:
    # Once per run: the database checks, lint, format, types and the shard check. The tests run in
    # `backend-tests`.
    name: Backend
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        # The same exact tag as compose's db (checked in `checks`): the queue md5 depends on it.
        image: postgres:17.11
        env:
          # Throwaway database of this job only; not a secret.
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CLASSBEAT_TEST_DATABASE_URL: postgresql+psycopg://postgres:test@127.0.0.1:5432/classbeat
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Create the application database and its roles
        # The script the compose db container runs (docker/postgres/init), against the service
        # container. The test fixtures replace the role passwords with random ones.
        working-directory: .
        env:
          PGHOST: 127.0.0.1
          PGUSER: postgres
          PGPASSWORD: test
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -d postgres -c 'CREATE DATABASE classbeat'
          secrets="$RUNNER_TEMP/secrets"
          mkdir -p "$secrets"
          openssl rand -hex 16 > "$secrets/database_owner_password"
          openssl rand -hex 16 > "$secrets/database_password"
          export DATABASE_OWNER_PASSWORD_FILE="$secrets/database_owner_password"
          export DATABASE_PASSWORD_FILE="$secrets/database_password"
          psql -v ON_ERROR_STOP=1 -d classbeat -f docker/postgres/init/10-roles.sql
          # Idempotent: a second run must succeed too.
          psql -v ON_ERROR_STOP=1 -d classbeat -f docker/postgres/init/10-roles.sql

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          # Must equal the ghcr.io/astral-sh/uv tag in the Dockerfile (checked by the `checks` job).
          version: 0.13.6

      - name: Install dependencies
        run: uv sync --locked

      # Regenerates the expected md5 of the queue functions (ADR 0005 section 3) on the pinned
      # image and fails when the committed queue_digests.py is stale (README: how to refresh it).
      # The database goes back to base afterwards; the tests migrate it themselves.
      - name: Queue functions match their shipped md5
        env:
          PGHOST: 127.0.0.1
          PGUSER: postgres
          PGPASSWORD: test
          CLASSBEAT_MIGRATIONS_DATABASE_URL: postgresql+psycopg://classbeat_owner@127.0.0.1:5432/classbeat
        run: |
          set -euo pipefail
          export CLASSBEAT_SECRETS_DIR="$RUNNER_TEMP/secrets"
          uv run alembic upgrade head
          psql --single-transaction -v ON_ERROR_STOP=1 -q -d classbeat -f ../docker/postgres/queue/20-queue.sql
          # Idempotent: a second run must succeed too.
          psql --single-transaction -v ON_ERROR_STOP=1 -q -d classbeat -f ../docker/postgres/queue/20-queue.sql
          uv run python tests/queue_digests.py --check
          uv run alembic downgrade base

      - name: Lint
        run: uv run ruff check

      - name: Format check
        run: uv run ruff format --check

      - name: Type check
        run: uv run pyright

      # The backend-tests matrix runs each test file in exactly one shard (tests/shards.py
      # compares pytest's own collection with the split). The shard count comes from one place,
      # the matrix's `shard` list (scripts/ci-shards.sh in `changes`), here and in every shard.
      - name: Every test file is in exactly one shard
        env:
          TOTAL: ${{ needs.changes.outputs.shards }}
        run: |
          set -euo pipefail
          [[ $TOTAL =~ ^[1-9][0-9]*$ ]] || { echo "::error::no shard count from changes"; exit 1; }
          uv run python tests/shards.py check "$TOTAL"

  # pytest in parallel shards, each with its own Postgres (tests/shards.py: a stable hash of the
  # file path). The `ci` gate sees one result for the matrix: failure or cancelled if any shard is.
  backend-tests:
    name: Backend tests (shard ${{ matrix.shard }})
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      # The only place the shard count is set: scripts/ci-shards.sh reads it from this list and
      # refuses another axis, include or exclude.
      matrix:
        shard: [1, 2, 3]
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        # The same exact tag as compose's db (checked in `checks`): the queue md5 depends on it.
        image: postgres:17.11
        env:
          # Throwaway database of this job only; not a secret.
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CLASSBEAT_TEST_DATABASE_URL: postgresql+psycopg://postgres:test@127.0.0.1:5432/classbeat
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Create the application database and its roles
        # The script the compose db container runs (docker/postgres/init), against the service
        # container. The test fixtures replace the role passwords with random ones.
        working-directory: .
        env:
          PGHOST: 127.0.0.1
          PGUSER: postgres
          PGPASSWORD: test
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -d postgres -c 'CREATE DATABASE classbeat'
          secrets="$RUNNER_TEMP/secrets"
          mkdir -p "$secrets"
          openssl rand -hex 16 > "$secrets/database_owner_password"
          openssl rand -hex 16 > "$secrets/database_password"
          export DATABASE_OWNER_PASSWORD_FILE="$secrets/database_owner_password"
          export DATABASE_PASSWORD_FILE="$secrets/database_password"
          psql -v ON_ERROR_STOP=1 -d classbeat -f docker/postgres/init/10-roles.sql
          # Idempotent: a second run must succeed too.
          psql -v ON_ERROR_STOP=1 -d classbeat -f docker/postgres/init/10-roles.sql

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          # Must equal the ghcr.io/astral-sh/uv tag in the Dockerfile (checked by the `checks` job).
          version: 0.13.6

      - name: Install dependencies
        run: uv sync --locked

      - name: Tests
        env:
          SHARD: ${{ matrix.shard }}
          # The count from the matrix's shard list, computed once in `changes` and passed to the
          # shard check and every shard alike; never strategy.job-total.
          TOTAL: ${{ needs.changes.outputs.shards }}
        run: |
          set -euo pipefail
          [[ $TOTAL =~ ^[1-9][0-9]*$ ]] || { echo "::error::no shard count from changes"; exit 1; }
          mapfile -t files < <(uv run python tests/shards.py list "$SHARD" "$TOTAL")
          [ "${#files[@]}" -gt 0 ] || { echo "::error::shard $SHARD of $TOTAL is empty"; exit 1; }
          echo "shard $SHARD of $TOTAL: ${#files[@]} test files"
          uv run pytest "${files[@]}"

  e2e:
    name: Stack, image scan and E2E (Playwright)
    needs: changes
    if: needs.changes.outputs.stack == 'true'
    runs-on: ubuntu-24.04
    env:
      # The test-only fake OpenID provider (compose.e2e.yaml); never part of the default stack.
      COMPOSE_FILE: compose.yaml:compose.e2e.yaml
      COMPOSE_PROFILES: e2e
    defaults:
      run:
        working-directory: e2e
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install Trivy
        env:
          VERSION: 0.76.1
          SHA256: c7cbe3137fb8a48a17574bede3dd6beb16742d1e9772929940fc90082c39d9c0
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -fsSL -o trivy.tgz \
            "https://github.com/aquasecurity/trivy/releases/download/v${VERSION}/trivy_${VERSION}_Linux-64bit.tar.gz"
          echo "${SHA256}  trivy.tgz" | sha256sum --check
          tar -xzf trivy.tgz trivy

      - name: Create .env and secrets
        working-directory: .
        run: |
          set -euo pipefail
          scripts/worktree.sh init
          # init leaves the model keys empty (ADR 0006 section 9, ADR 0012 section 2). A random
          # canary each, never a real key, lets the checks below prove where the values go. The
          # worker stays on `fake`.
          for key in anthropic_api_key openai_api_key deepseek_api_key; do
            if [ ! -f "secrets/$key" ] || [ -s "secrets/$key" ]; then
              echo "::error::init must create an empty secrets/$key"
              exit 1
            fi
            printf 'ci-canary-not-a-key-%s' "$(openssl rand -hex 16)" > "secrets/$key"
          done
          # Swedebeat's app key (ADR 0015 section 4) is web's only and empty from init. A random
          # canary of the right shape (32 and 16 characters, never Swedebeat's) lets the checks
          # below prove where it goes. The image built here has no key of its own.
          [ -f secrets/swedebeat_app ] && [ ! -s secrets/swedebeat_app ] \
            || { echo "::error::init must create an empty secrets/swedebeat_app"; exit 1; }
          printf '{"key": "%s", "iv": "%s"}' "$(openssl rand -hex 16)" "$(openssl rand -hex 8)" \
            > secrets/swedebeat_app

      - name: Start the stack
        working-directory: .
        run: docker compose up -d --build --wait

      - name: Check /api/ready and /
        working-directory: .
        run: |
          set -euo pipefail
          port="$(sed -n 's/^WEB_PORT=//p' .env)"
          curl -fsS --retry 5 --retry-delay 2 "http://127.0.0.1:${port}/api/ready"
          curl -fsS "http://127.0.0.1:${port}/" | grep -qi '<!doctype html>'

      - name: Check the containers run as non-root
        working-directory: .
        run: |
          set -euo pipefail
          for svc in web worker; do
            uid="$(docker compose exec -T "$svc" id -u)"
            echo "$svc runs as uid $uid"
            [ "$uid" != "0" ] || { echo "::error::$svc runs as root"; exit 1; }
          done

      # Secret values only come from files under secrets/ (Docker secrets); none may appear
      # in the container configuration. Values are never printed.
      - name: Check no secret value is in docker inspect
        working-directory: .
        run: |
          set -euo pipefail
          mapfile -t containers < <(docker compose ps -aq)
          [ "${#containers[@]}" -gt 0 ] || { echo "::error::no containers found"; exit 1; }
          docker inspect "${containers[@]}" > "$RUNNER_TEMP/inspect.json"
          checked=0
          for f in secrets/*; do
            [ -s "$f" ] || continue
            checked=$((checked + 1))
            if grep -qF -- "$(cat "$f")" "$RUNNER_TEMP/inspect.json"; then
              echo "::error::a value from $f appears in docker inspect"
              exit 1
            fi
          done
          [ "$checked" -gt 0 ] || { echo "::error::no secret files were checked"; exit 1; }
          # The connection KEK (ADR 0004 section 7) and the model key canaries (ADR 0006 section
          # 9, ADR 0012 section 2) must exist and so were among them.
          [ -s secrets/connection_kek ] || { echo "::error::secrets/connection_kek is missing"; exit 1; }
          for key in anthropic_api_key openai_api_key deepseek_api_key; do
            [ -s "secrets/$key" ] || { echo "::error::secrets/$key is empty"; exit 1; }
          done
          rm -f "$RUNNER_TEMP/inspect.json"

      # The superuser password (ADR 0005 section 3, amending ADR 0002 section 4) is mounted on db
      # and db-functions only: never on web, worker, migrate or maint (all profiles enabled).
      - name: Check postgres_password is mounted on db and db-functions only
        working-directory: .
        run: |
          set -euo pipefail
          config="$(docker compose --profile '*' config --format json)"
          holders="$(jq -r '[.services | to_entries[]
            | select((.value.secrets // []) | map(.source) | index("postgres_password")) | .key]
            | sort | join(" ")' <<< "$config")"
          echo "postgres_password is mounted on: $holders"
          [ "$holders" = "db db-functions" ] \
            || { echo "::error::postgres_password must be mounted on db and db-functions only"; exit 1; }
          for svc in web worker migrate maint; do
            jq -e --arg s "$svc" '.services | has($s)' <<< "$config" > /dev/null \
            || { echo "::error::service $svc not found in the compose config"; exit 1; }
          done
          for svc in web worker; do
            docker compose exec -T "$svc" sh -c '! test -e /run/secrets/postgres_password' \
            || { echo "::error::$svc can read postgres_password"; exit 1; }
          done
          [ "$(docker inspect --format '{{.State.ExitCode}}' "$(docker compose ps -aq db-functions)")" = 0 ] \
            || { echo "::error::db-functions did not succeed"; exit 1; }

      # ADR 0011 section 5: the admin role's password is mounted on db-functions (which sets it)
      # and web (the admin area) only: never on the worker, migrate or maint.
      - name: Check database_maint_password is mounted on db-functions and web only
        working-directory: .
        run: |
          set -euo pipefail
          config="$(docker compose --profile '*' config --format json)"
          holders="$(jq -r '[.services | to_entries[]
            | select((.value.secrets // []) | map(.source) | index("database_maint_password"))
            | .key] | sort | join(" ")' <<< "$config")"
          echo "database_maint_password is mounted on: $holders"
          [ "$holders" = "db-functions web" ] \
            || { echo "::error::database_maint_password must be mounted on db-functions and web only"; exit 1; }
          docker compose exec -T web test -s /run/secrets/database_maint_password \
            || { echo "::error::web does not have the database_maint_password secret"; exit 1; }
          docker compose exec -T worker sh -c '! test -e /run/secrets/database_maint_password' \
            || { echo "::error::the worker can read database_maint_password"; exit 1; }

      # ADR 0015 section 4: Swedebeat's app key never reaches this image (only the release
      # workflow passes it), and the runtime secret is on web only.
      - name: Check the Swedebeat app key is not in the image and is mounted on web only
        working-directory: .
        run: |
          set -euo pipefail
          for svc in web worker; do
            docker compose exec -T "$svc" sh -c 'test ! -e /app/swedebeat_app.json' \
              || { echo "::error::$svc has a baked-in Swedebeat app key file"; exit 1; }
          done
          docker compose exec -T web test -s /run/secrets/swedebeat_app \
            || { echo "::error::web does not have the swedebeat_app secret"; exit 1; }
          docker compose exec -T worker sh -c '! test -e /run/secrets/swedebeat_app' \
            || { echo "::error::the worker can read swedebeat_app"; exit 1; }
          mapfile -t containers < <(docker compose ps -aq)
          web="$(docker compose ps -q web)"
          for c in "${containers[@]}"; do
            if [ "$c" != "$web" ] && docker inspect \
              --format '{{range .Mounts}}{{println .Source .Destination}}{{end}}' "$c" \
              | grep -q 'swedebeat_app'; then
              echo "::error::a container other than web mounts swedebeat_app"
              exit 1
            fi
          done

      # ADR 0006 section 9, ADR 0012 section 2: each model key is a file on the worker only,
      # never an env variable.
      - name: Check the model keys are mounted on the worker only
        working-directory: .
        run: |
          set -euo pipefail
          keys='anthropic_api_key|openai_api_key|deepseek_api_key'
          worker="$(docker compose ps -q worker)"
          [ -n "$worker" ] || { echo "::error::no worker container"; exit 1; }
          for key in anthropic_api_key openai_api_key deepseek_api_key; do
            if ! docker compose exec -T worker test -s "/run/secrets/$key"; then
              echo "::error::the worker does not have the $key secret"
              exit 1
            fi
          done
          provider="$(docker compose exec -T worker printenv CLASSBEAT_MODEL_PROVIDER)"
          if [ "$provider" != "fake" ]; then
            echo "::error::the stack's worker must run the fake model provider"
            exit 1
          fi
          mapfile -t containers < <(docker compose ps -aq)
          [ "${#containers[@]}" -gt 1 ] || { echo "::error::too few containers"; exit 1; }
          for c in "${containers[@]}"; do
            name="$(docker inspect --format '{{.Name}}' "$c")"
            if [ "$c" != "$worker" ] && docker inspect \
              --format '{{range .Mounts}}{{println .Source .Destination}}{{end}}' "$c" \
              | grep -qE "$keys"; then
              echo "::error::$name mounts a model key; only the worker may"
              exit 1
            fi
            # CLASSBEAT_DEEPSEEK_ENABLED is the one setting that names a provider (not a key).
            if docker inspect --format '{{range .Config.Env}}{{println .}}{{end}}' "$c" \
              | grep -vE '^CLASSBEAT_DEEPSEEK_ENABLED=(true|false)$' \
              | grep -qiE '^[a-z0-9_]*(anthropic|openai|deepseek|api_key)[a-z0-9_]*='; then
              echo "::error::$name has a model key variable in its environment"
              exit 1
            fi
          done

      # The image the running stack was built from (never pushed). Fails on HIGH and CRITICAL
      # findings that have a fix available (--ignore-unfixed): an accepted risk, see AGENTS.md.
      - name: Scan the image the stack runs
        working-directory: .
        run: |
          set -euo pipefail
          image="$(docker inspect --format '{{.Image}}' "$(docker compose ps -q web)")"
          "$RUNNER_TEMP/trivy" image \
            --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 \
            "$image"

      - run: npm ci
      - run: npm run typecheck
      - run: npx playwright install --with-deps chromium

      # M6 (#338): back up, destroy, restore into a fresh project and verify (rows, RLS, sign-in,
      # right key decrypts, wrong key fails). Own compose projects; the image build is a cache hit.
      - name: Backup and restore drill
        working-directory: .
        timeout-minutes: 10
        run: scripts/backup-restore-drill.sh ci

      - name: Run the tests
        run: npx playwright test

      # Everything the E2E run did went through web and worker (sign-ins, connects, picks, saves,
      # the admin area): none of their logs may hold the value of a secret file (M6, #339; the
      # in-process version over all fake flows is backend/tests/test_m6_security_logs.py).
      - name: Check no secret value is in the web and worker logs
        working-directory: .
        run: |
          set -euo pipefail
          docker compose logs --no-color web worker > "$RUNNER_TEMP/stack.log"
          [ -s "$RUNNER_TEMP/stack.log" ] || { echo "::error::no web or worker logs"; exit 1; }
          checked=0
          for f in secrets/*; do
            [ -s "$f" ] || continue
            checked=$((checked + 1))
            value="$(cat "$f")"
            b64="$(printf '%s' "$value" | base64 -w0)"
            hex="$(printf '%s' "$value" | od -An -tx1 | tr -d ' \n')"
            forms=("$value" "$b64" "${b64//=/}" "$(printf '%s' "${b64//=/}" | tr '+/' '-_')" "$hex" "${hex^^}")
            for form in "${forms[@]}"; do
              if grep -qF -- "$form" "$RUNNER_TEMP/stack.log"; then
                # Only the file name is printed, and the next step does not print the logs
                # either: a failure log must not hold the value.
                echo "LOGS_LEAK=1" >> "$GITHUB_ENV"
                echo "::error::a value (or its base64 or hex form) from $f appears in the web or worker logs"
                exit 1
              fi
            done
          done
          [ "$checked" -gt 0 ] || { echo "::error::no secret files were checked"; exit 1; }

      - name: Upload the report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7

      # Not after a secret was found in the logs: this step would print it again.
      - name: Logs on failure
        if: failure() && env.LOGS_LEAK != '1'
        working-directory: .
        run: docker compose ps -a && docker compose logs --no-color --tail 100

      - name: Stop the stack
        if: always()
        working-directory: .
        run: docker compose down -v

  # The one required check. `changes` and `checks` must succeed. Every other job must succeed, or be
  # skipped while its filter output is false (scripts/ci-gate.sh, tested in `checks`). A job that is
  # needed but skipped, cancelled or failed fails the gate, so nothing is bypassed silently.
  ci:
    name: ci
    if: always()
    needs: [changes, checks, backend, backend-tests, frontend, e2e]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: All needed jobs passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
          NEEDS: ${{ toJSON(needs) }}
        run: scripts/ci-gate.sh
