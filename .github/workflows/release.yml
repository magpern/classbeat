name: Release

# Runs only for a version tag pushed to this repository. Pull requests never reach it
# (the CI `compose` job already proves the image builds without pushing).
on:
  push:
    tags: ['v*.*.*']

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/magpern/classbeat
  DB_IMAGE: ghcr.io/magpern/classbeat-db

jobs:
  verify:
    name: Verify tag
    if: github.repository == 'magpern/classbeat'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Tag is a SemVer version on main
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          semver='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$'
          if ! [[ "$TAG" =~ $semver ]]; then
            echo "::error::Tag '$TAG' is not vMAJOR.MINOR.PATCH[-prerelease]"
            exit 1
          fi
          # fetch-depth: 0 fetched every branch; no credentials are needed (or kept) here.
          if ! git rev-parse --verify --quiet refs/remotes/origin/main >/dev/null; then
            echo "::error::origin/main is missing from the checkout"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag commit $GITHUB_SHA is not on main"
            exit 1
          fi

  image:
    name: Image
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # X.Y.Z, X.Y (skipped for pre-releases by the semver type) and sha-<short>.
      # `latest` is never published: deployments pin a version.
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      # Swedebeat's app key goes into the image from the owner's repository secret SWEDEBEAT_APP
      # (ADR 0015 section 4): checked here and again by the Dockerfile, passed only as a BuildKit
      # secret (never a build argument, never printed), and this is the only workflow that has it.
      - name: Check the Swedebeat app key secret
        env:
          SWEDEBEAT_APP: ${{ secrets.SWEDEBEAT_APP }}
        run: |
          set -euo pipefail
          test -n "$SWEDEBEAT_APP" || { echo "::error::Set the SWEDEBEAT_APP repository secret"; exit 1; }
          printf '%s' "$SWEDEBEAT_APP" | python3 -c "import json, sys; d = json.load(sys.stdin); assert set(d) == {'key', 'iv'} and len(d['key']) == 32 and len(d['iv']) == 16" 2>/dev/null \
            || { echo "::error::SWEDEBEAT_APP must be JSON with a 32-character key and a 16-character iv"; exit 1; }

      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          SWEDEBEAT_APP: ${{ secrets.SWEDEBEAT_APP }}
        with:
          context: .
          secret-envs: swedebeat_app=SWEDEBEAT_APP # gitleaks:allow
          build-args: REQUIRE_SWEDEBEAT_APP=1
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          # No layer cache in either direction: the image holds the app key, and a cache export
          # would copy that layer into the Actions cache.

  # The database image (ADR 0020, #565): postgres plus the init, queue and maint SQL, built from
  # docker/postgres alone (that folder is the whole build context; it holds no secret). Same tags
  # as the app image, so CLASSBEAT_VERSION pins both.
  db-image:
    name: Database image
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.DB_IMAGE }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: docker/postgres
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true

  # GitHub artifact attestations for both images (#583, ADR 0020 Decision 3): a signed statement,
  # by this workflow run, that the image digest the build just pushed came from this repository's
  # tag. A separate job on purpose: the image job holds the Swedebeat app key and gets no
  # `id-token`; this one gets no secret and no registry write. The attestation lives in GitHub's
  # attestation store (no `push-to-registry`), keyed by the digest, so `gh attestation verify
  # oci://...` finds it from the pulled image. It runs before the release: a failed attestation
  # publishes no release.
  attest-images:
    name: Attest images
    needs: [image, db-image]
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
      attestations: write
    steps:
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ needs.image.outputs.digest }}

      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.DB_IMAGE }}
          subject-digest: ${{ needs.db-image.outputs.digest }}

  release:
    name: GitHub Release
    needs: [image, db-image, attest-images]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      # The tag's own deploy files become release assets (ADR 0020), after both images exist: a
      # release that carries a compose file always has the images it names.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the release assets
        env:
          RUNNER_TEMP: ${{ runner.temp }}
        run: |
          set -euo pipefail
          assets="$RUNNER_TEMP/release-assets"
          scripts/release-assets.sh build "$assets"
          ( cd "$assets" && sha256sum -c SHA256SUMS )

      # Every asset, SHA256SUMS included, is a subject: `gh attestation verify <file> -R
      # magpern/classbeat` then proves a downloaded file is the one this run built from the tag.
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/release-assets/*

      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          RUNNER_TEMP: ${{ runner.temp }}
          APP_DIGEST: ${{ needs.image.outputs.digest }}
          DB_DIGEST: ${{ needs.db-image.outputs.digest }}
        run: |
          set -euo pipefail
          assets="$RUNNER_TEMP/release-assets"
          # The digests the attested images have; the runbook compares them with what a pull resolves to.
          notes="$RUNNER_TEMP/release-notes.md"
          {
            echo "Image digests (attested; verify with \`gh attestation verify\`, see docs/runbooks/vps-deploy.md):"
            echo
            echo "- \`$IMAGE@$APP_DIGEST\`"
            echo "- \`$DB_IMAGE@$DB_DIGEST\`"
          } > "$notes"
          flags=()
          if [[ "$TAG" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$TAG" --generate-notes --notes-file "$notes" --verify-tag "${flags[@]}" "$assets"/*
