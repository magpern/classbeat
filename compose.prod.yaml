# Production stack for the owner's server (issue #341, behind swag since #492): web, worker, db and
# the one-shot migrate and db-functions. TLS, the public ports and the edge headers are the owner's
# swag (linuxserver/swag, nginx) container, which is not part of this file. Standalone (not an
# override of compose.yaml): nothing of the dev stack's published ports, mailpit, build or fake
# model provider can leak into it.
#
#   docker compose config -q          # with COMPOSE_FILE=compose.prod.yaml in .env (runbook)
#   docker compose up -d --wait
#
# Runbook: docs/runbooks/vps-deploy.md; swag site config: docs/runbooks/swag-classbeat.subdomain.conf.
# Configuration only: deploying is the owner's step.
#
# Variables (a .env next to this file; values are the owner's, none are committed):
#   CLASSBEAT_VERSION  release tag of ghcr.io/magpern/classbeat and of ghcr.io/magpern/classbeat-db
#                      (the database image, same tag; X.Y.Z, never `latest`)              required
#   CLASSBEAT_DOMAIN   the public host name, no scheme (classbeat.pernemark.se)           required
#   PROXY_IP           swag's fixed IPv4 address on the proxy network: the only peer whose
#                      X-Forwarded-For web believes (ADR 0003 section 9)                   required
#   PROXY_NETWORK      the external Docker network web shares with swag (classbeat-proxy) optional
#   SMTP_HOST, SMTP_SENDER                                                                required
#   SMTP_PORT, SMTP_TLS, SMTP_USERNAME, ADMIN_EMAILS, SIGNUP_MODE, CONNECTION_KEK_ID,
#   MODEL_PROVIDER, DEEPSEEK_ENABLED, SWEDEBEAT_ENABLED, RUNNING_ENABLED, SMTP_CA_FILE    optional
#   MOWL_QR_ENABLED (ADR 0024, default false)                                             optional
#   LOCALES (ADR 0023, default en,sv,da: the languages offered; a subset of the build)    optional
#   OAUTH_GOOGLE_CLIENT_ID, OAUTH_GITHUB_CLIENT_ID, OAUTH_MICROSOFT_CLIENT_ID (not secret),
#   OAUTH_VISIBLE_PROVIDERS (default google)                                              optional
# Secrets are files under ./secrets (mounted as Docker secrets, never environment variables), group
# 10010 and mode 0640: see x-secrets-gid below.
#
# Networks: `backend` is internal (no route out): db, migrate and db-functions live only there.
# `proxy` is the owner's external network (created once, `docker network create --internal
# --subnet ... --ip-range ...`, runbook section 6a) that only swag and web join: the only inbound
# path to the app; swag has a fixed address on it (PROXY_IP), outside the --ip-range Docker hands
# out to other containers. PROXY_IP is one private IPv4 address, never a range or a list (prod
# refuses to start otherwise). `web-out` is web's way out (SMTP, the Spotify and
# Google/GitHub/Microsoft token endpoints) and joins nothing else. `egress` is the worker's way out
# to the model providers, MOWL and Spotify. No service publishes a port; the variant where the
# proxy reaches web on 127.0.0.1 instead is the overlay compose.prod.loopback.yaml.

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-hardening: &hardening
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

# Secret files (#511). Outside Swarm, Compose bind-mounts a file secret with its host owner and mode
# and ignores `uid`, `gid` and `mode`, so the reading uid needs a permission on the host file. Every
# file in secrets/ is `<deploy user>:10010`, mode 0640 (never world-readable; runbook section 5), and
# every service that mounts a secret runs as a non-root user with the supplementary group 10010
# (classbeat-secrets on the host, which has no members there). The postgres services run as
# `postgres` (uid 999) from the start: the image's root entrypoint would re-exec as postgres through
# gosu, which drops supplementary groups, and its init scripts read the role password files.
# scripts/check-prod-compose.sh checks both, and the mode and group of the real files on the server.
x-secrets-gid: &secrets-gid
  - "10010"

x-app: &app
  image: ghcr.io/magpern/classbeat:${CLASSBEAT_VERSION:?set CLASSBEAT_VERSION to a release tag}
  restart: unless-stopped
  logging: *logging
  <<: *hardening
  # The image's user (uid 10001) reads its secret files through the group classbeat-secrets.
  group_add: *secrets-gid
  environment: &app-env
    CLASSBEAT_ENVIRONMENT: prod
    CLASSBEAT_LOG_LEVEL: INFO
    CLASSBEAT_DATABASE_URL: postgresql+psycopg://classbeat_app@db:5432/classbeat
    # The one public origin (ADR 0003 section 4); prod refuses anything but https.
    CLASSBEAT_PUBLIC_BASE_URL: https://${CLASSBEAT_DOMAIN:?set CLASSBEAT_DOMAIN}
    CLASSBEAT_SIGNUP_MODE: ${SIGNUP_MODE:-invite}
    CLASSBEAT_ADMIN_EMAILS: ${ADMIN_EMAILS:-}
    # Real mail (ADR 0003 section 5): starttls or tls; the password is the smtp_password secret.
    CLASSBEAT_SMTP_HOST: ${SMTP_HOST:?set SMTP_HOST}
    CLASSBEAT_SMTP_PORT: ${SMTP_PORT:-587}
    CLASSBEAT_SMTP_TLS: ${SMTP_TLS:-starttls}
    CLASSBEAT_SMTP_SENDER: ${SMTP_SENDER:?set SMTP_SENDER}
    CLASSBEAT_MAIL_SUPPORT_ADDRESS: ${MAIL_SUPPORT_ADDRESS:-support@classbeat.eu}
    CLASSBEAT_SMTP_USERNAME: ${SMTP_USERNAME:-}
    CLASSBEAT_CONNECTION_KEK_ID: ${CONNECTION_KEK_ID:-kek-1}
    CLASSBEAT_DEEPSEEK_ENABLED: ${DEEPSEEK_ENABLED:-false}
  secrets:
    - database_password
    - app_secret_key
    - connection_kek
  depends_on:
    db-functions:
      condition: service_completed_successfully

services:
  db:
    # The release's database image (docker/postgres/Dockerfile): postgres:17.11 with the role init
    # scripts, the queue functions and the maint role baked in, so the server needs no checkout.
    image: ghcr.io/magpern/classbeat-db:${CLASSBEAT_VERSION:?set CLASSBEAT_VERSION to a release tag}
    restart: unless-stopped
    logging: *logging
    # As postgres from the start (not root, then gosu), so group 10010 reaches the init scripts.
    user: postgres
    group_add: *secrets-gid
    environment:
      POSTGRES_DB: classbeat
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
      - database_owner_password
      - database_password
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d classbeat"]
      interval: 10s
      timeout: 5s
      retries: 10

  migrate:
    <<: *app
    restart: "no"
    command: ["alembic", "upgrade", "head"]
    environment:
      <<: *app-env
      CLASSBEAT_MIGRATIONS_DATABASE_URL: postgresql+psycopg://classbeat_owner@db:5432/classbeat
    secrets:
      - source: database_owner_password
        target: database_owner_password
    networks:
      - backend
    depends_on:
      db:
        condition: service_healthy

  # The job queue's role and functions (ADR 0005 section 3), run as the superuser after the
  # migrations; same arrangement as compose.yaml (the password goes through a tmpfs PGPASSFILE).
  db-functions:
    image: ghcr.io/magpern/classbeat-db:${CLASSBEAT_VERSION:?set CLASSBEAT_VERSION to a release tag}
    restart: "no"
    logging: *logging
    user: postgres
    group_add: *secrets-gid
    entrypoint: ["sh", "/queue/db-functions.sh"]
    secrets:
      - postgres_password
      - database_maint_password
    tmpfs:
      - /run/pgpass:mode=0700,uid=999,gid=999
    networks:
      - backend
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    <<: *app
    read_only: true
    # ADR 0026 stage 1 (#735): ceilings so one service cannot take the box. Web is one Python
    # process (it cannot use much more than a core); the memory leaves room for its pool and
    # requests. Override in .env (WEB_CPUS, WEB_MEMORY); never above the host's CPU count, or the
    # container does not start. Without memswap_limit (check-prod-compose.sh allows only the keys it
    # lists) a container can swap before the kernel kills it on a host with swap. Runbook 5c.
    cpus: ${WEB_CPUS:-1.0}
    mem_limit: ${WEB_MEMORY:-1g}
    tmpfs:
      - /tmp
    environment:
      <<: *app-env
      CLASSBEAT_MAINT_DATABASE_URL: postgresql+psycopg://classbeat_maint@db:5432/classbeat
      # swag's fixed address on `proxy`: the only peer whose X-Forwarded-For is believed (ADR 0003
      # section 9). One private address, never a range: any other container on that network, the
      # host, and Cloudflare (swag restores the visitor from CF-Connecting-IP itself) are not
      # trusted. Prod refuses a public address here.
      CLASSBEAT_TRUSTED_PROXIES: ${PROXY_IP:?set PROXY_IP to swag's fixed address on the proxy network}
      # ADR 0015: off unless the owner switches the Swedebeat connection on.
      CLASSBEAT_SWEDEBEAT_ENABLED: ${SWEDEBEAT_ENABLED:-false}
      # ADR 0018: off unless the owner switches running classes on.
      CLASSBEAT_RUNNING_ENABLED: ${RUNNING_ENABLED:-false}
      # ADR 0007 (soundless classes): off unless the owner switches them on, after the live checks.
      CLASSBEAT_SOUNDLESS_ENABLED: ${SOUNDLESS_ENABLED:-false}
      # ADR 0024 (#647): connect MOWL by QR code, web only; off until the owner's live scan.
      CLASSBEAT_MOWL_QR_ENABLED: ${MOWL_QR_ENABLED:-false}
      # ADR 0023 section 1 (ML2): the languages offered, a subset of the build's manifest (`en` is
      # always on). Web only; today the manifest holds English alone, so this changes nothing yet.
      CLASSBEAT_LOCALES: ${LOCALES:-en,sv,da}
      # Opt-in (docs/runbooks/proton-bridge-smtp.md): a mounted PEM that the SMTP certificate must
      # match instead of the system store. Web only; unset keeps full system-store verification.
      CLASSBEAT_SMTP_CA_FILE: ${SMTP_CA_FILE:-}
      # OAuth sign-in (ADR 0003 section 5), web only: a provider is on only when its client id here
      # and its secret file secrets/oauth_<provider>_client_secret both hold a value (an empty file,
      # or an empty id, is off). The client secret is never a variable. The redirect URI is
      # CLASSBEAT_PUBLIC_BASE_URL + /oauth/<provider>/callback (runbook section 5a).
      CLASSBEAT_OAUTH_GOOGLE_CLIENT_ID: ${OAUTH_GOOGLE_CLIENT_ID:-}
      CLASSBEAT_OAUTH_GITHUB_CLIENT_ID: ${OAUTH_GITHUB_CLIENT_ID:-}
      CLASSBEAT_OAUTH_MICROSOFT_CLIENT_ID: ${OAUTH_MICROSOFT_CLIENT_ID:-}
      CLASSBEAT_OAUTH_VISIBLE_PROVIDERS: ${OAUTH_VISIBLE_PROVIDERS:-google}
      # ADR 0025 (Amendment 2): Cloudflare Turnstile on sign-in, sign-up and reset, web only. On by
      # default: it needs the public site key here (TURNSTILE_SITE_KEY) and the secret in
      # secrets/turnstile_secret_key, or web refuses to start. TURNSTILE_ENABLED=false is the
      # emergency and off switch (web then starts and logs an ERROR). The fake is never set here.
      CLASSBEAT_TURNSTILE_ENABLED: ${TURNSTILE_ENABLED:-true}
      CLASSBEAT_TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-}
    # swedebeat_app: Swedebeat's app key if the image does not hold it (ADR 0015 section 4).
    # oauth_*_client_secret: web only; each file must exist, empty while that provider is off.
    # turnstile_secret_key: web only; the file must exist; Turnstile is on by default, so it must hold the key unless TURNSTILE_ENABLED=false.
    secrets:
      - database_password
      - app_secret_key
      - connection_kek
      - database_maint_password
      - smtp_password
      - swedebeat_app
      - oauth_google_client_secret
      - oauth_github_client_secret
      - oauth_microsoft_client_secret
      - turnstile_secret_key
    # No `ports`: reachable only from swag over `proxy` (as classbeat-web, so the name cannot
    # collide with another stack's `web` there).
    expose:
      - "8000"
    networks:
      proxy:
        aliases:
          - classbeat-web
      web-out: {}
      backend: {}
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/ready', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  worker:
    <<: *app
    command: ["python", "-m", "classbeat.worker"]
    # ADR 0005 section 3: up to 25 s for runs to reach a checkpoint, then the leases go back.
    stop_grace_period: 30s
    # ADR 0026 stage 1 (#735): a mix analysis (a child of up to 1.5 GiB, a core or more for up to
    # 180 s) must not starve web and db. Memory: CLASSBEAT_MIX_ANALYSIS_CONCURRENCY x 1.5 GiB plus
    # about 1 GiB for the worker itself (3g for the default cap of 1). Over the ceiling the kernel
    # kills the container: compose restarts it and the reaper requeues its jobs. Override in .env
    # (WORKER_CPUS, WORKER_MEMORY); never above the host's CPU count. Runbook section 5c.
    cpus: ${WORKER_CPUS:-1.0}
    mem_limit: ${WORKER_MEMORY:-3g}
    environment:
      <<: *app-env
      # `fake` is refused when the environment is prod; the key is secrets/anthropic_api_key.
      CLASSBEAT_MODEL_PROVIDER: ${MODEL_PROVIDER:-anthropic}
      # ADR 0016: a design job on a Swedebeat mix checks the switch again; the same value as web's.
      CLASSBEAT_SWEDEBEAT_ENABLED: ${SWEDEBEAT_ENABLED:-false}
      # ADR 0018: a queued running design or revise checks the switch again; the same as web's.
      CLASSBEAT_RUNNING_ENABLED: ${RUNNING_ENABLED:-false}
      # ADR 0007 (soundless classes): a queued soundless design checks the switch again.
      CLASSBEAT_SOUNDLESS_ENABLED: ${SOUNDLESS_ENABLED:-false}
    # The model API keys are the worker's only (ADR 0006 section 9, ADR 0012 section 2).
    secrets:
      - database_password
      - app_secret_key
      - connection_kek
      - anthropic_api_key
      - openai_api_key
      - deepseek_api_key
    networks:
      - backend
      - egress

networks:
  proxy:
    external: true
    name: ${PROXY_NETWORK:-classbeat-proxy}
  # Fixed so that its gateway, 172.29.80.1, is known: the peer web sees with the loopback overlay.
  web-out:
    ipam:
      config:
        - subnet: 172.29.80.0/24
          gateway: 172.29.80.1
  backend:
    internal: true
  egress: {}

secrets:
  postgres_password:
    file: ./secrets/postgres_password
  database_owner_password:
    file: ./secrets/database_owner_password
  database_password:
    file: ./secrets/database_password
  app_secret_key:
    file: ./secrets/app_secret_key
  connection_kek:
    file: ./secrets/connection_kek
  database_maint_password:
    file: ./secrets/database_maint_password
  smtp_password:
    file: ./secrets/smtp_password
  anthropic_api_key:
    file: ./secrets/anthropic_api_key
  openai_api_key:
    file: ./secrets/openai_api_key
  deepseek_api_key:
    file: ./secrets/deepseek_api_key
  swedebeat_app:
    file: ./secrets/swedebeat_app
  oauth_google_client_secret:
    file: ./secrets/oauth_google_client_secret
  oauth_github_client_secret:
    file: ./secrets/oauth_github_client_secret
  oauth_microsoft_client_secret:
    file: ./secrets/oauth_microsoft_client_secret
  turnstile_secret_key:
    file: ./secrets/turnstile_secret_key

volumes:
  db-data:
