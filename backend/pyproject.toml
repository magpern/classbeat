[project]
name = "classbeat"
version = "0.1.0"
description = "classbeat backend: web API and worker"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.14",
    "anthropic==0.125.0",
    "argon2-cffi==25.1.0",
    "authlib==1.9.1",
    "certifi>=2026.10.23",  # imported by classbeat.egress: the model transport's trust store
    "cryptography==50.0.2",
    "fastapi>=0.115",
    "httpx==0.28.1",
    "joserfc==1.7.7",
    # The domain library (ADR 0001): v0.7.0 built from its tag WITHOUT the bundled Swedebeat app
    # key (scripts/build-mowl-wheel.sh; threat model, accepted risks). Pinned by uv.lock's hash.
    "mowl-workouts==0.7.0",
    # ADR 0012 section 3: 2.54.0 is the last release on httpx (3.x requires httpx2, which the
    # egress allowlist is not built on); the `httpx2` extra is never installed. Review with #120.
    "openai==2.54.0",
    "psycopg[binary]>=3.2",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "pyotp==2.10.0",
    "segno==1.6.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "uvicorn[standard]>=0.34",
]

[dependency-groups]
dev = [
    "pyright>=1.1.390",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.8",
]
# Only for CI (`uv run --only-group audit`); not installed in the runtime image.
audit = [
    "pip-audit==2.10.1",
]

[tool.uv]
# mowl-workouts depends on `mcp` for its own MCP server (mowl.server), which classbeat never runs.
# `mcp` brings `httpx2`, which Authlib then prefers over httpx (it broke the OAuth client), so it
# is left out of classbeat's environment and image.
exclude-dependencies = ["mcp"]

[tool.uv.sources]
mowl-workouts = { path = "vendor/mowl_workouts-0.7.0-py3-none-any.whl" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/classbeat"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = ["error"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "ASYNC", "RUF", "S", "PT"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.pyright]
typeCheckingMode = "standard"
pythonVersion = "3.12"
include = ["src", "tests", "migrations"]
venvPath = "."
venv = ".venv"
