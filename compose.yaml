# Local stack: db, migrate (one-shot), web, worker, mailpit.
# Ports bind 127.0.0.1 only and come from .env (scripts/worktree.sh init writes it).
# Passwords are files under secrets/ mounted as Docker secrets, never environment variables.

x-app: &app
  build: .
  image: ${COMPOSE_PROJECT_NAME:-classbeat}:local
  restart: "no"
  environment: &app-env
    CLASSBEAT_ENVIRONMENT: dev
    # Web and worker connect as the app role; the password comes from the database_password
    # secret file (Settings reads it). Migrations use the owner role (see `migrate`).
    CLASSBEAT_DATABASE_URL: postgresql+psycopg://classbeat_app@db:5432/classbeat
    # The origin the browser uses (ADR 0003 section 4); the Origin check compares against it.
    CLASSBEAT_PUBLIC_BASE_URL: http://127.0.0.1:${WEB_PORT:-8000}
  secrets:
    - database_password
    - app_secret_key
  depends_on:
    migrate:
      condition: service_completed_successfully

services:
  db:
    image: postgres:17.11
    restart: unless-stopped
    environment:
      POSTGRES_DB: classbeat
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
      - database_owner_password
      - database_password
    volumes:
      - db-data:/var/lib/postgresql/data
      # Creates classbeat_owner and classbeat_app on the first start of an empty volume
      # (`docker compose down -v` to get them on an older volume).
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:${DB_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d classbeat"]
      interval: 3s
      timeout: 5s
      retries: 20

  migrate:
    <<: *app
    command: ["alembic", "upgrade", "head"]
    environment:
      <<: *app-env
      CLASSBEAT_MIGRATIONS_DATABASE_URL: postgresql+psycopg://classbeat_owner@db:5432/classbeat
    secrets:
      - source: database_owner_password
        target: database_owner_password
    depends_on:
      db:
        condition: service_healthy

  web:
    <<: *app
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_PORT:-8000}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/ready', timeout=3)"
      interval: 3s
      timeout: 5s
      retries: 20

  worker:
    <<: *app
    restart: unless-stopped
    command: ["python", "-m", "classbeat.worker"]

  mailpit:
    image: axllent/mailpit:v1.32.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MAILPIT_PORT:-8025}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 10

secrets:
  postgres_password:
    file: ./secrets/postgres_password
  database_owner_password:
    file: ./secrets/database_owner_password
  database_password:
    file: ./secrets/database_password
  app_secret_key:
    file: ./secrets/app_secret_key

volumes:
  db-data:
