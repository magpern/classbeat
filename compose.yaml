# Local stack: db, migrate and db-functions (one-shot), web, worker, mailpit.
# Ports bind 127.0.0.1 only and come from .env (scripts/worktree.sh init writes it).
# Passwords are files under secrets/ mounted as Docker secrets, never environment variables.

x-app: &app
  build: .
  image: ${COMPOSE_PROJECT_NAME:-classbeat}:local
  restart: "no"
  environment: &app-env
    CLASSBEAT_ENVIRONMENT: dev
    # Web and worker connect as the app role; the password comes from the database_password
    # secret file (Settings reads it). Migrations use the owner role (see `migrate`).
    CLASSBEAT_DATABASE_URL: postgresql+psycopg://classbeat_app@db:5432/classbeat
    # The origin the browser uses (ADR 0003 section 4); the Origin check compares against it.
    CLASSBEAT_PUBLIC_BASE_URL: http://127.0.0.1:${WEB_PORT:-8000}
    # Mail goes to mailpit (ADR 0003 section 5); plain SMTP is allowed only for this service.
    # Outside the dev stack: CLASSBEAT_SMTP_HOST/PORT/SENDER/TLS and the smtp_password secret.
    CLASSBEAT_SMTP_HOST: mailpit
    CLASSBEAT_SMTP_PORT: "1025"
    CLASSBEAT_SMTP_TLS: none
    CLASSBEAT_SMTP_SENDER: classbeat@classbeat.test
    # The id of the current key-encryption key, the secret file connection_kek (ADR 0004
    # section 2). On rotation: a new id in .env, the old file kept as connection_kek_<old id> and
    # listed under secrets of web and worker until `keys rewrap` reports zero rows for it.
    CLASSBEAT_CONNECTION_KEK_ID: ${CONNECTION_KEK_ID:-kek-1}
    # ADR 0012 section 2: off, the DeepSeek host is never on the worker's list and no DeepSeek
    # route can be set or used. Web and worker alike; the owner turns it on (ADR 0012 section 6).
    CLASSBEAT_DEEPSEEK_ENABLED: ${DEEPSEEK_ENABLED:-false}
  secrets:
    - database_password
    - app_secret_key
    - connection_kek
  depends_on:
    db-functions:
      condition: service_completed_successfully

services:
  db:
    image: postgres:17.11
    restart: unless-stopped
    environment:
      POSTGRES_DB: classbeat
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
      - database_owner_password
      - database_password
    volumes:
      - db-data:/var/lib/postgresql/data
      # Creates classbeat_owner and classbeat_app on the first start of an empty volume
      # (`docker compose down -v` to get them on an older volume).
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:${DB_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d classbeat"]
      interval: 3s
      timeout: 5s
      retries: 20

  migrate:
    <<: *app
    command: ["alembic", "upgrade", "head"]
    environment:
      <<: *app-env
      CLASSBEAT_MIGRATIONS_DATABASE_URL: postgresql+psycopg://classbeat_owner@db:5432/classbeat
    secrets:
      - source: database_owner_password
        target: database_owner_password
    depends_on:
      db:
        condition: service_healthy

  # The job queue's role and SECURITY DEFINER functions (ADR 0005 section 3), run as the superuser
  # after the migrations, in one transaction. Besides `db`, this is the only service that gets the
  # postgres_password secret; the password goes into a PGPASSFILE on a tmpfs built at run time,
  # never into the environment or the command line, so it is not in `docker inspect`.
  db-functions:
    image: postgres:17.11
    restart: "no"
    user: postgres
    entrypoint: ["sh", "/queue/db-functions.sh"]
    # database_maint_password: the admin role's password, set by 31-maint-password.psql (ADR 0011
    # section 5). Mounted here and on web only, never on the worker, migrate or maint.
    secrets:
      - postgres_password
      - database_maint_password
    tmpfs:
      - /run/pgpass:mode=0700,uid=999,gid=999
    volumes:
      - ./docker/postgres/queue:/queue:ro
      - ./docker/postgres/maint:/maint:ro
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    <<: *app
    restart: unless-stopped
    environment:
      <<: *app-env
      # The admin area's audited role (ADR 0011 section 5); the password is the
      # database_maint_password secret, on web only. Without it the admin routes answer 503.
      CLASSBEAT_MAINT_DATABASE_URL: postgresql+psycopg://classbeat_maint@db:5432/classbeat
      # ADR 0015: the Swedebeat connection is off unless the owner switches it on here.
      CLASSBEAT_SWEDEBEAT_ENABLED: ${SWEDEBEAT_ENABLED:-false}
    # swedebeat_app (ADR 0015 section 4) is web's only: Swedebeat's app key as a runtime
    # override of the key a release image holds. Empty from init (empty is no key).
    secrets:
      - database_password
      - app_secret_key
      - connection_kek
      - database_maint_password
      - swedebeat_app
    ports:
      - "127.0.0.1:${WEB_PORT:-8000}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/ready', timeout=3)"
      interval: 3s
      timeout: 5s
      retries: 20

  worker:
    <<: *app
    restart: unless-stopped
    command: ["python", "-m", "classbeat.worker"]
    # ADR 0005 section 3: on SIGTERM the worker waits up to 25 s for runs to reach a checkpoint,
    # then hands their leases back (each under the role's 5 s lock_timeout) within these 30 s.
    stop_grace_period: 30s
    environment:
      <<: *app-env
      # ADR 0006 section 9: `fake` (the default in .env.example) for the dev stack and CI;
      # `anthropic` needs a real key in secrets/anthropic_api_key, which init leaves empty.
      CLASSBEAT_MODEL_PROVIDER: ${MODEL_PROVIDER:-fake}
      # ADR 0016: a design job on a Swedebeat mix checks the switch again when it runs; off here,
      # every such job ends feature_off. The same value as web's.
      CLASSBEAT_SWEDEBEAT_ENABLED: ${SWEDEBEAT_ENABLED:-false}
    # The model API keys are the worker's only: web, migrate and maint never mount them
    # (ADR 0006 section 9, ADR 0012 section 2).
    secrets:
      - database_password
      - app_secret_key
      - connection_kek
      - anthropic_api_key
      - openai_api_key
      - deepseek_api_key

  # Maintenance after a suspected KEK compromise (ADR 0004 section 2), never started by default:
  #   docker compose stop web worker
  #   docker compose --profile maint run --rm maint python -m classbeat keys wipe --confirm
  # It connects as the owner role (web and worker never get its password) and has no KEK. With no
  # command it only prints the usage. Outside the dev stack also give it the smtp_password secret.
  maint:
    <<: *app
    profiles: [maint]
    restart: "no"
    command: ["python", "-m", "classbeat", "keys", "--help"]
    environment:
      <<: *app-env
      CLASSBEAT_MIGRATIONS_DATABASE_URL: postgresql+psycopg://classbeat_owner@db:5432/classbeat
    secrets:
      - source: database_owner_password
        target: database_owner_password

  mailpit:
    image: axllent/mailpit:v1.32.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MAILPIT_PORT:-8025}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 10

secrets:
  postgres_password:
    file: ./secrets/postgres_password
  database_owner_password:
    file: ./secrets/database_owner_password
  database_password:
    file: ./secrets/database_password
  app_secret_key:
    file: ./secrets/app_secret_key
  connection_kek:
    file: ./secrets/connection_kek
  # The admin role classbeat_maint (ADR 0011 section 5): db-functions and web only.
  database_maint_password:
    file: ./secrets/database_maint_password
  # Empty from `scripts/worktree.sh init` (never a real key); worker only.
  anthropic_api_key:
    file: ./secrets/anthropic_api_key
  # ADR 0012 section 2: the same, for OpenAI and DeepSeek (empty from init; worker only).
  openai_api_key:
    file: ./secrets/openai_api_key
  deepseek_api_key:
    file: ./secrets/deepseek_api_key
  # ADR 0015 section 4: Swedebeat's app key, JSON {"key", "iv"}; empty or absent is no key.
  swedebeat_app:
    file: ./secrets/swedebeat_app

volumes:
  db-data:
