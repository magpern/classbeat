# Overlay for compose.prod.spotdown.yaml (#1489; ADR 0040, amendment of 2026-11-24, item 7): spotdown's
# route out, for YouTube sourcing. OFF until the owner adds this file to COMPOSE_FILE, after
# compose.prod.spotdown.yaml (bridge still last), together with SPOTDOWN_YTDLP_SOURCING=true in .env:
#
#   COMPOSE_FILE=compose.prod.yaml:compose.prod.spotdown.yaml:compose.prod.spotdown-egress.yaml
#   SPOTDOWN_YTDLP_SOURCING=true
#
# One network, `spotdown-egress`, the project's own and not internal (like spotdown's own
# deploy/compose.yaml `egress`), joined by spotdown-api and spotdown-worker only: never by
# spotdown-redis (no password; it stays on spotdown-internal alone), classbeat's worker, web or any
# other service. No port is published; the internal networks spotdown and spotdown-internal are
# unchanged. Without SPOTDOWN_YTDLP_SOURCING Compose refuses this file (the line below), and
# scripts/check-prod-compose.sh refuses it with any value but `true`, and refuses `true` without it.
# Deciding to source from YouTube (its terms of service) is the owner's; agents and CI never call it.

services:
  spotdown-api:
    environment:
      ALLOW_YTDLP_SOURCING: ${SPOTDOWN_YTDLP_SOURCING:?set SPOTDOWN_YTDLP_SOURCING=true in .env with compose.prod.spotdown-egress.yaml (runbook section 5d)}
    networks:
      - spotdown-egress

  spotdown-worker:
    environment:
      ALLOW_YTDLP_SOURCING: ${SPOTDOWN_YTDLP_SOURCING:?set SPOTDOWN_YTDLP_SOURCING=true in .env with compose.prod.spotdown-egress.yaml (runbook section 5d)}
    networks:
      - spotdown-egress

networks:
  spotdown-egress: {}
