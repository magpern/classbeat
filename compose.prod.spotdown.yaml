# Overlay for compose.prod.yaml (ADR 0040 section 10 and its amendment of 2026-11-25, #1526): classbeat's
# worker calls a spotdown that runs somewhere else. OFF until the owner adds this file to COMPOSE_FILE:
# without it the stack, its settings and its behaviour are exactly compose.prod.yaml's (nothing calls
# spotdown).
#
#   COMPOSE_FILE=compose.prod.yaml:compose.prod.spotdown.yaml      (in .env; runbook section 5d)
#   (with an overlay of section 6b or 6c: that overlay first, this file after it, bridge last)
#   SPOTDOWN_URL   spotdown's internal origin, optional, default http://spotdown-api:8000
#
# classbeat never runs spotdown ("Classbeat is classbeat, spotdown is spotdown."): spotdown is its own
# project, installed from its own release and runbook (magpern/spotdown, docs/runbooks/docker-image.md).
# This file gives the worker, and nothing else, the three things it needs to call it:
#   - the URL (classbeat.spotdown.url_policy decides which origins the worker accepts);
#   - the service key, secrets/spotdown_service_key, a copy of spotdown's key value with the same file rules
#     as every classbeat secret (group 10010, mode 640); never on web;
#   - spotdown's network, an external one that spotdown's runbook creates (`--internal`); classbeat never
#     creates it, and `up` fails if it is missing. Only the worker joins it, never web.
# scripts/check-prod-compose.sh checks this, and refuses any production render with a spotdown service,
# image or volume. Needs Docker Compose 2.24.4 or later.

services:
  worker:
    environment:
      CLASSBEAT_SPOTDOWN_URL: ${SPOTDOWN_URL:-http://spotdown-api:8000}
    secrets:
      - spotdown_service_key
    networks:
      - spotdown

networks:
  spotdown:
    external: true
    name: spotdown

secrets:
  spotdown_service_key:
    file: ./secrets/spotdown_service_key
