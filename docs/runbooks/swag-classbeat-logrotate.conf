# Access-log retention for classbeat behind swag: 30 days at most (runbook vps-deploy.md section 7
# step 6; the privacy notice at /privacy says so, `privacy.retention.li7`). The log holds each
# visitor's IP address. The current file holds at most one day, so 29 rotated files make 30 days
# at most; maxage 30 removes anything older even if a rotation was missed.
# Installed to /config/log/classbeat-logrotate.conf in swag's volume by install-swag-logrotate.sh.
# If you change the period, change the privacy notice in the same PR; a test checks they agree.
/config/log/nginx/classbeat.access.log {
    daily
    rotate 29
    maxage 30
    missingok
    notifempty
    compress
    delaycompress
    copytruncate
}
