## classbeat behind swag (linuxserver/swag, nginx) - issue #492, runbook docs/runbooks/vps-deploy.md
## Copy to /config/nginx/proxy-confs/classbeat.subdomain.conf in swag's volume, set server_name,
## then `docker exec swag nginx -t && docker exec swag nginx -s reload`.
## scripts/check-prod-compose.sh runs `nginx -t` on this file (with stand-ins for swag's ssl.conf and
## the Cloudflare list), so keep it valid as it stands.
##
## What this file relies on, and why:
## - The app sets Content-Security-Policy and Referrer-Policy itself on every response
##   (backend/src/classbeat/headers.py). Never add, hide or replace either here, or in swag's
##   ssl.conf (its optional `add_header Content-Security-Policy` and `Referrer-Policy` lines must stay
##   commented). The headers below are the ones only the TLS edge adds; if ssl.conf already adds one
##   of them, delete it here so it is sent once.
## - The client address (ADR 0003 section 9): web trusts exactly one peer, this swag container
##   (PROXY_IP in compose.prod.yaml), and reads only X-Forwarded-For from it. This file overwrites
##   that header with $remote_addr, exactly once (a second X-Forwarded-For line would add the
##   visitor's value as the right-most entry, the one the app takes), so nothing a visitor sends
##   reaches the app. Behind Cloudflare's
##   proxy, $remote_addr is restored from CF-Connecting-IP only when the TCP peer is in Cloudflare's
##   published ranges (the real-ip lines below); the app itself never trusts Cloudflare.
## - Request bodies: the app refuses more than 64 KiB (#351); 1m here stops larger ones at nginx.

## Access log without the query string (OAuth codes and other one-time values travel in it), and no
## cookie, authorization or referrer header. http context: this file is included inside http {}.
log_format classbeat_noquery '$remote_addr [$time_local] "$request_method $uri" $status $body_bytes_sent $request_time';

server {
    listen 443 ssl;
    listen [::]:443 ssl;

    ## The exact public name, never `classbeat.*`. Must equal CLASSBEAT_DOMAIN.
    server_name classbeat.pernemark.se;

    ## swag's certificate and TLS settings.
    include /config/nginx/ssl.conf;

    access_log /config/log/nginx/classbeat.access.log classbeat_noquery;

    ## No nginx version in the Server header or on nginx's own error pages (#495).
    server_tokens off;

    client_max_body_size 1m;
    client_header_timeout 10s;
    client_body_timeout 10s;

    ## Cloudflare (orange cloud, "proxied") only: restore the visitor from CF-Connecting-IP when the
    ## peer is one of Cloudflare's ranges. cf_real-ip.conf holds one `set_real_ip_from <range>;` per
    ## published range (the swag mod linuxserver/mods:swag-cloudflare-real-ip writes and refreshes it).
    ## With DNS only (grey cloud), delete these two lines: the peer is the visitor.
    include /config/nginx/cf_real-ip.conf;
    real_ip_header CF-Connecting-IP;

    ## Edge headers the app does not send (it sends CSP and Referrer-Policy). `always`, so error
    ## answers carry them too. No includeSubDomains or preload: those are a deliberate later step.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;

    ## Forwarded headers, set here once so every location inherits them (a location that sets any
    ## proxy_set_header of its own would drop all of these). No proxy.conf include: swag's appends to
    ## a visitor's X-Forwarded-For instead of replacing it.
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    ## nginx passes every other request header through: clear the address-like ones a visitor could
    ## send (the app reads none of them; an empty value is not sent).
    proxy_set_header X-Real-IP "";
    proxy_set_header CF-Connecting-IP "";
    proxy_set_header True-Client-IP "";
    proxy_set_header Forwarded "";
    proxy_set_header X-Forwarded-Host "";
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;

    ## nginx's own 502/503/504 (classbeat down or unreachable), answered as 502: a plain-text line
    ## instead of nginx's HTML page, as Caddy's handle_errors did (#495). text/plain under the
    ## server-level nosniff runs nothing, and these codes are not cacheable by default. No add_header
    ## in that location: one would drop every edge header above, and the app's CSP is never added
    ## here. The app's own error answers pass through untouched (proxy_intercept_errors stays off).
    error_page 502 503 504 @classbeat_down;

    ## Resolved per request through Docker's DNS (swag's resolver.conf: `resolver 127.0.0.11`), so
    ## swag starts while classbeat is down. classbeat-web is web's alias on the proxy network.
    ## Loopback overlay instead: `set $upstream_classbeat 127.0.0.1;` and port WEB_HOST_PORT below.
    set $upstream_classbeat classbeat-web;

    ## Progress stream (GET /api/jobs/{id}/events, Server-Sent Events): unbuffered, never compressed,
    ## and a read timeout above the stream's 600 s life (the app writes a comment every 15 s).
    location ~ ^/api/jobs/[^/]+/events$ {
        proxy_pass http://$upstream_classbeat:8000;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 900s;
    }

    location / {
        proxy_pass http://$upstream_classbeat:8000;
    }

    location @classbeat_down {
        default_type text/plain;
        return 502 "classbeat is unavailable, try again shortly\n";
    }
}
